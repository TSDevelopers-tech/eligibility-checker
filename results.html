<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#E8F1F8;
      margin:0;
      padding:0;
    }

    .container {
      max-width:900px;
      margin:2rem auto;
      background:#fff;
      padding:2rem;
      border-radius:8px;
      border:1px solid #D8DDE0;
    }

    h1 {
      color:#005EB8;
      margin-top:0;
      margin-bottom:1rem;
    }

    h2 {
      color:#003087;
      margin-top:2rem;
      margin-bottom:0.5rem;
    }

    .result-box {
      background:#F0F7FF;
      border-left:4px solid #005EB8;
      padding:1rem;
      border-radius:4px;
      color:#003087;
      margin-bottom:1.5rem;
      font-size:0.95rem;
    }

    .service {
      background:#fff;
      border:1px solid #D8DDE0;
      padding:1rem;
      border-radius:6px;
      margin-bottom:1rem;
    }

    .service h3 {
      margin-top:0;
      color:#003087;
    }

    .badge {
      display:inline-block;
      padding:0.25rem 0.6rem;
      border-radius:4px;
      font-size:0.8rem;
      font-weight:bold;
      margin-bottom:0.6rem;
      color:#fff;
    }

    .badge-lifestyle { background:#007f3b; }
    .badge-medication { background:#005EB8; }
    .badge-surgery { background:#DA291C; }

    .service a {
      display:inline-block;
      margin-top:0.5rem;
      color:#005EB8;
      text-decoration:none;
      font-weight:bold;
    }

    .service a:hover { text-decoration:underline; }

    button {
      background:#005EB8;
      color:#fff;
      border:none;
      padding:0.9rem 1.6rem;
      font-size:1rem;
      border-radius:6px;
      cursor:pointer;
      margin-top:2rem;
    }

    button:hover { background:#003087; }

    .back-start-btn {
      background:#D8DDE0;
      color:#003087;
      margin-top:1rem;
    }

    .back-start-btn:hover { background:#C0C6CC; }
  </style>
</head>

<body>
  <div class="container">
    <h1>Your Results</h1>

    <div id="summary" class="result-box"></div>

    <h2>Services You May Be Eligible For</h2>
    <div id="services"></div>

    <button class="back-start-btn" onclick="location.href='index.html'">
      Back to Start
    </button>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("wmData") || "{}");

    data.height = Number(data.height);
    data.weight = Number(data.weight);

    function calculateBMI(weight, height) {
      return (weight / ((height / 100) ** 2)).toFixed(1);
    }

    function buildSummary() {
      const bmi = calculateBMI(data.weight, data.height);
      const ethnicityAdj = data.ethnicity === "adjusted" ? " (adjusted thresholds apply)" : "";

      document.getElementById("summary").innerHTML = `
        <strong>Your BMI:</strong> ${bmi}${ethnicityAdj}<br><br>
        Based on the information you provided, here are the services you may be eligible for.
      `;
    }

    function buildServices() {
      const bmi = calculateBMI(data.weight, data.height);

      // Apply ethnicity BMI reduction ONLY where required
      const adjBMI = data.ethnicity === "adjusted" ? bmi - 2.5 : bmi;

      const services = [];

      /* DIGITAL WMP — ethnicity-adjusted */
      if (adjBMI >= 30 && (data.t1dm || data.t2dm || data.hypertension)) {
        services.push({
          title: "NHS Digital Weight Management Programme",
          desc: "A 12-week online programme to support weight loss.",
          referral: "Referral required from your GP or community pharmacy.",
          link: "https://www.england.nhs.uk/digital-weight-management/",
          type: "lifestyle"
        });
      }

      /* WEST SUSSEX WELLBEING – 12 WEEK COURSE (BMI 25–40) — NOT ethnicity-adjusted */
      if (bmi >= 25 && bmi <= 40) {
        services.push({
          title: "West Sussex Wellbeing – 12‑week Weight Management Course",
          desc: "In‑person or virtual group programme supporting healthy eating and activity.",
          referral: "Self‑referral directly to West Sussex Wellbeing.",
          link: "https://www.westsussexwellbeing.org.uk/topics/healthy-eating/services-for-west-sussex",
          type: "lifestyle"
        });
      }

      /* GROHEALTH – DIGITAL PROGRAMME (BMI >25) — NOT ethnicity-adjusted */
      if (bmi > 25) {
        services.push({
          title: "GroHealth – 12‑month Digital Programme",
          desc: "App‑based personalised weight management support for West Sussex residents.",
          referral: "Self‑referral via the GroHealth website.",
          link: "https://web.grohealth.com/west-sussex",
          type: "lifestyle"
        });
      }

      /* BETTER HEALTH – ALWAYS AVAILABLE */
      services.push({
        title: "Better Health – NHS Healthy Families",
        desc: "National NHS support with healthy eating, recipes, activity and weight management.",
        referral: "Open access — no referral required.",
        link: "https://www.nhs.uk/healthier-families/",
        type: "lifestyle"
      });

      /* DIABETES PREVENTION PROGRAMME */
      if (data.prediabetes || data.gestational) {
        services.push({
          title: "NHS Diabetes Prevention Programme",
          desc: "Support to reduce your risk of developing Type 2 diabetes.",
          referral: "Referral from your GP OR self‑referral to Healthier You (Xyla).",
          link: "https://preventing-diabetes.co.uk",
          type: "lifestyle"
        });
      }

      /* SPECIALIST WEIGHT MANAGEMENT (TIER 3 – MORELIFE/OVIVA) */
      if (
        (bmi > 40) || // NOT ethnicity-adjusted
        (bmi > 35 && (data.hypertension || data.cvd || data.sleepApnoea)) || // NOT ethnicity-adjusted
        (adjBMI > 30 && data.t2dm) // ethnicity-adjusted ONLY for this rule
      ) {
        services.push({
          title: "Specialist Weight Management Service",
          desc: "12‑month specialist programme.",
          referral: "Referral required from your GP.",
          type: "lifestyle"
        });
      }

      /* WEGOVY – ethnicity-adjusted */
      if (adjBMI >= 35 && (
        data.precancer ||
        data.transplant ||
        data.iih ||
        data.surgeryBarrier ||
        data.fertility ||
        data.genetic ||
        data.severeOSA
      )) {
        services.push({
          title: "Wegovy® (semaglutide)",
          desc: "Weekly self-injection prescribed via specialist weight services, alongside lifestyle support.",
          referral: "Referral required from your GP to the specialist weight management service.",
          link: "https://www.nhs.uk/medicines/semaglutide/",
          type: "medication"
        });
      }

      /* MOUNJARO – ethnicity-adjusted */
      const mounjaroConditions = [
        data.t2dm,
        data.hypertension,
        data.cvd,
        data.sleepApnoea,
        data.lipids
      ];

      if (adjBMI >= 35 && mounjaroConditions.filter(x => x).length >= 4) {
        services.push({
          title: "Mounjaro® (tirzepatide)",
          desc: "Weekly self-injection prescribed by your GP with mandatory behavioural support via the BSOP programme.",
          referral: "Prescribed directly by your GP. Mandatory enrolment into the BSOP programme.",
          link: "https://healthieryou.org.uk/bsop-programme/",
          type: "medication"
        });
      }

      /* BARIATRIC SURGERY – ethnicity-adjusted */
      if (
        adjBMI >= 40 ||
        (adjBMI >= 35 && (
          data.cvd ||
          data.hypertension ||
          data.iih ||
          data.sleepApnoea ||
          data.t2dm
        ))
      ) {
        services.push({
          title: "Bariatric Surgery Assessment",
          desc: "Assessment for surgical weight loss options.",
          referral: "Referral required from your GP to the bariatric surgery team.",
          link: "https://www.nhs.uk/conditions/weight-loss-surgery/",
          type: "surgery"
        });
      }

      const container = document.getElementById("services");

      const badgeMap = {
        lifestyle: '<span class="badge badge-lifestyle">Lifestyle</span>',
        medication: '<span class="badge badge-medication">Medication & Lifestyle</span>',
        surgery: '<span class="badge badge-surgery">Surgery</span>'
      };

      container.innerHTML = services.length
        ? services.map(s => `
            <div class="service">
              ${badgeMap[s.type]}
              <h3>${s.title}</h3>
              <p>${s.desc}</p>
              <p><strong>How to access:</strong> ${s.referral}</p>
              <a href="${s.link}" target="_blank">Visit website</a>
            </div>
          `).join("")
        : "<p>No services matched your criteria.</p>";
    }

    buildSummary();
    buildServices();
  </script>
</body>
</html>
