<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#E8F1F8;
      margin:0;
      padding:0;
    }

    .container {
      max-width:900px;
      margin:2rem auto;
      background:#fff;
      padding:2rem;
      border-radius:8px;
      border:1px solid #D8DDE0;
    }

    h1 {
      color:#005EB8;
      margin-top:0;
    }

    h3 {
      color:#003087;
      margin-bottom:0.3rem;
    }

    #bmiText {
      color:#425563;
      font-size:1rem;
      margin-bottom:1.5rem;
    }

    .service {
      border-top:1px solid #D8DDE0;
      padding-top:1rem;
      margin-top:1rem;
    }

    .tag {
      display:inline-block;
      padding:0.2rem 0.5rem;
      border-radius:4px;
      font-size:0.8rem;
      margin-right:0.5rem;
      margin-bottom:0.5rem;
    }

    .lifestyle { background:#E8F1F8; color:#00703C; }
    .medication { background:#FFF4D8; color:#946200; }
    .surgery { background:#FBE3E5; color:#DA291C; }

    .referral {
      background:#F0F7FF;
      border-left:4px solid #005EB8;
      padding:0.8rem;
      margin-top:0.6rem;
      border-radius:4px;
      color:#003087;
      font-size:0.9rem;
    }

    .footer-note {
      margin-top:2rem;
      font-size:0.85rem;
      color:#425563;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Your Eligibility Results</h1>
    <p id="bmiText"></p>

    <div id="results"></div>

    <p class="footer-note">
      This checker is a simplified interpretation of the Surrey & Sussex adult weight management pathway.
      It does not replace medical advice.
    </p>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("wmData") || "{}");

    function bmiCalc(h, w) {
      if (!h || !w) return null;
      return w / ((h/100)**2);
    }

    const bmi = bmiCalc(Number(data.height), Number(data.weight));
    const adjBMI = data.ethnicity === "adjusted" ? bmi - 2.5 : bmi;

    document.getElementById("bmiText").textContent =
      bmi ? `BMI: ${bmi.toFixed(1)} (adjusted: ${adjBMI.toFixed(1)})`
          : "BMI could not be calculated.";

    const results = [];

    // NHS Digital WMP
    if (adjBMI >= 30 && (data.t1dm || data.t2dm || data.hypertension)) {
      results.push({
        name:"NHS Digital Weight Management Programme",
        type:"lifestyle",
        desc:"12‑week digital programme for BMI ≥30 with diabetes or high blood pressure.",
        referral:"Referral is made by your GP or community pharmacy."
      });
    }

    // Tier 2 West Sussex Wellbeing
    if (adjBMI >= 25 && adjBMI <= 40) {
      results.push({
        name:"West Sussex Wellbeing (Tier 2)",
        type:"lifestyle",
        desc:"12‑week course or GroHealth app for BMI ≥25.",
        referral:"You can self‑refer directly via West Sussex Wellbeing."
      });
    }

    // NDPP
    if (data.prediabetes || data.gestational) {
      results.push({
        name:"NHS Diabetes Prevention Programme",
        type:"lifestyle",
        desc:"Support for prediabetes or previous gestational diabetes.",
        referral:"You can self‑refer to Healthier You (Xyla) or ask your GP to refer you."
      });
    }

    // Wegovy
    const wegovyQual =
      data.precancer || data.transplant || data.iih ||
      data.surgeryBarrier || data.fertility || data.genetic || data.severeOSA;

    if (adjBMI >= 35 && wegovyQual) {
      results.push({
        name:"Wegovy (Semaglutide) – Tier 3",
        type:"medication",
        desc:"Weekly injection + lifestyle support for BMI ≥35 with qualifying condition.",
        referral:"Your GP must refer you to the specialist Tier 3 weight management service."
      });
    }

    // Mounjaro
    const mounjaroCount =
      (data.t2dm?1:0) + (data.hypertension?1:0) + (data.cvd?1:0) +
      (data.sleepApnoea?1:0) + (data.lipids?1:0);

    if (adjBMI >= 35 && mounjaroCount >= 4) {
      results.push({
        name:"Mounjaro (Tirzepatide) – BSOP",
        type:"medication",
        desc:"Weekly injection + mandatory behavioural support for BMI ≥35 + 4 qualifying conditions.",
        referral:"Your GP must refer you into the NHS Behavioural Support for Obesity Prescribing Programme."
      });
    }

    // Bariatric surgery
    if (adjBMI > 50 || adjBMI >= 40 ||
        (adjBMI >= 35 && (data.cvd || data.hypertension || data.iih || data.sleepApnoea || data.t2dm))) {
      results.push({
        name:"Bariatric Surgery (Tier 4)",
        type:"surgery",
        desc:"Surgical option for BMI >50, or ≥40, or ≥35 with obesity‑related conditions.",
        referral:"Referral is made by your GP to the regional bariatric surgery service."
      });
    }

    // Tier 3 MoreLife/Oviva
    if (adjBMI > 40 ||
        (adjBMI > 35 && (data.hypertension || data.cvd || data.sleepApnoea)) ||
        (adjBMI > 30 && data.t2dm)) {
      results.push({
        name:"Specialist Tier 3 Programme (MoreLife / Oviva)",
        type:"lifestyle",
        desc:"12‑month specialist programme for higher BMI or Type 2 diabetes.",
        referral:"Your GP can refer you once you have completed Tier 2 without achieving 5% weight loss."
      });
    }

    const container = document.getElementById("results");

    if (results.length === 0) {
      container.innerHTML = "<p>No specific service identified. You may still benefit from Tier 2 support.</p>";
    } else {
      results.forEach(s => {
        const div = document.createElement("div");
        div.className = "service";
        div.innerHTML = `
          <h3>${s.name}</h3>
          <span class="tag ${s.type}">${s.type}</span>
          <p>${s.desc}</p>
          <div class="referral"><strong>How to access:</strong> ${s.referral}</div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
