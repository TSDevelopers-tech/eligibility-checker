<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fb; margin:0; padding:0; }
    .container { max-width:900px; margin:2rem auto; background:#fff; padding:2rem;
      border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    h1 { margin-top:0; }
    .service { border-top:1px solid #ddd; padding-top:1rem; margin-top:1rem; }
    .tag { display:inline-block; padding:0.2rem 0.5rem; border-radius:4px; font-size:0.8rem; margin-right:0.5rem; }
    .lifestyle { background:#e3f5eb; color:#00703c; }
    .medication { background:#fff4d8; color:#946200; }
    .surgery { background:#fbe3e5; color:#b10e1e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your Eligibility Results</h1>
    <p id="bmiText"></p>

    <div id="results"></div>

    <p style="margin-top:2rem; font-size:0.85rem; color:#666;">
      This checker is a simplified interpretation of the Surrey & Sussex adult weight management pathway.
      It does not replace medical advice.
    </p>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("wmData") || "{}");

    function bmiCalc(h, w) {
      if (!h || !w) return null;
      return w / ((h/100)**2);
    }

    const bmi = bmiCalc(Number(data.height), Number(data.weight));
    const adjBMI = data.ethnicity === "adjusted" ? bmi - 2.5 : bmi;

    document.getElementById("bmiText").textContent =
      bmi ? `BMI: ${bmi.toFixed(1)} (adjusted: ${adjBMI.toFixed(1)})` :
      "BMI could not be calculated.";

    const results = [];

    // NHS Digital WMP
    if (adjBMI >= 30 && (data.t1dm || data.t2dm || data.hypertension)) {
      results.push({
        name:"NHS Digital Weight Management Programme",
        type:"lifestyle",
        desc:"12‑week digital programme for BMI ≥30 with diabetes or high blood pressure."
      });
    }

    // Tier 2 West Sussex Wellbeing
    if (adjBMI >= 25 && adjBMI <= 40) {
      results.push({
        name:"West Sussex Wellbeing (Tier 2)",
        type:"lifestyle",
        desc:"12‑week course or GroHealth app for BMI ≥25."
      });
    }

    // NDPP
    if (data.prediabetes || data.gestational) {
      results.push({
        name:"NHS Diabetes Prevention Programme",
        type:"lifestyle",
        desc:"Support for prediabetes or previous gestational diabetes."
      });
    }

    // Wegovy
    const wegovyQual =
      data.precancer || data.transplant || data.iih ||
      data.surgeryBarrier || data.fertility || data.genetic || data.severeOSA;

    if (adjBMI >= 35 && wegovyQual) {
      results.push({
        name:"Wegovy (Semaglutide) – Tier 3",
        type:"medication",
        desc:"Weekly injection + lifestyle support for BMI ≥35 with qualifying condition."
      });
    }

    // Mounjaro
    const mounjaroCount =
      (data.t2dm?1:0) + (data.hypertension?1:0) + (data.cvd?1:0) +
      (data.sleepApnoea?1:0) + (data.lipids?1:0);

    if (adjBMI >= 35 && mounjaroCount >= 4) {
      results.push({
        name:"Mounjaro (Tirzepatide) – BSOP",
        type:"medication",
        desc:"Weekly injection + mandatory behavioural support for BMI ≥35 + 4 qualifying conditions."
      });
    }

    // Bariatric surgery
    if (adjBMI > 50 || adjBMI >= 40 ||
        (adjBMI >= 35 && (data.cvd || data.hypertension || data.iih || data.sleepApnoea || data.t2dm))) {
      results.push({
        name:"Bariatric Surgery (Tier 4)",
        type:"surgery",
        desc:"Surgical option for BMI >50, or ≥40, or ≥35 with obesity‑related conditions."
      });
    }

    // Tier 3 MoreLife/Oviva
    if (adjBMI > 40 ||
        (adjBMI > 35 && (data.hypertension || data.cvd || data.sleepApnoea)) ||
        (adjBMI > 30 && data.t2dm)) {
      results.push({
        name:"Specialist Tier 3 Programme (MoreLife / Oviva)",
        type:"lifestyle",
        desc:"12‑month specialist programme for higher BMI or Type 2 diabetes."
      });
    }

    const container = document.getElementById("results");

    if (results.length === 0) {
      container.innerHTML = "<p>No specific service identified. You may still benefit from Tier 2 support.</p>";
    } else {
      results.forEach(s => {
        const div = document.createElement("div");
        div.className = "service";
        div.innerHTML = `
          <h3>${s.name}</h3>
          <span class="tag ${s.type}">${s.type}</span>
          <p>${s.desc}</p>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
