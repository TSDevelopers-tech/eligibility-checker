<script>
// --- Retrieve stored values ---
const fullName = localStorage.getItem("fullName");
const age = Number(localStorage.getItem("age"));
const height = Number(localStorage.getItem("height"));
const weight = Number(localStorage.getItem("weight"));
const waist = Number(localStorage.getItem("waist"));
const hip = Number(localStorage.getItem("hip"));
const conditions = JSON.parse(localStorage.getItem("conditions") || "[]");

// --- Calculate BMI ---
const bmi = weight / ((height / 100) ** 2);
const bmiRounded = bmi.toFixed(1);

// --- Adjusted BMI (for ethnicity logic if needed) ---
let adjustedBMI = bmi;
if (conditions.includes("southAsian")) {
    adjustedBMI = bmi + 2.5;
}
const adjustedRounded = adjustedBMI.toFixed(1);

// --- Eligibility Logic ---
let eligible = false;
let reason = "";

// Rule 1: BMI ≥ 30
if (adjustedBMI >= 30) {
    eligible = true;
    reason = "Your BMI is 30 or above.";
}

// Rule 2: BMI ≥ 27.5 for South Asian backgrounds
if (!eligible && conditions.includes("southAsian") && adjustedBMI >= 27.5) {
    eligible = true;
    reason = "Your adjusted BMI is 27.5 or above for South Asian backgrounds.";
}

// Rule 3: Waist-to-hip ratio
const whr = waist / hip;
if (!eligible && whr > 0.85) {
    eligible = true;
    reason = "Your waist-to-hip ratio indicates increased health risk.";
}

// Rule 4: Medical conditions
if (!eligible && conditions.includes("hypertension")) {
    eligible = true;
    reason = "You reported hypertension.";
}
if (!eligible && conditions.includes("diabetes")) {
    eligible = true;
    reason = "You reported diabetes.";
}

// --- Display Results ---
document.getElementById("name").innerText = fullName || "User";
document.getElementById("bmi").innerText = bmiRounded;
document.getElementById("adjusted").innerText = adjustedRounded;

if (eligible) {
    document.getElementById("result").innerText = "You are eligible for the NHS Weight Loss Service.";
    document.getElementById("reason").innerText = reason;
} else {
    document.getElementById("result").innerText = "You are not currently eligible for the NHS Weight Loss Service.";
    document.getElementById("reason").innerText = "Your measurements and health information do not meet the eligibility criteria.";
}
</script>
