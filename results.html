<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#E8F1F8;
      margin:0;
      padding:0;
    }

    .container {
      max-width:900px;
      margin:2rem auto;
      background:#fff;
      padding:2rem;
      border-radius:8px;
      border:1px solid #D8DDE0;
    }

    h1 {
      color:#005EB8;
      margin-top:0;
      margin-bottom:1rem;
    }

    h2 {
      color:#003087;
      margin-top:2rem;
      margin-bottom:0.5rem;
    }

    .result-box {
      background:#F0F7FF;
      border-left:4px solid #005EB8;
      padding:1rem;
      border-radius:4px;
      color:#003087;
      margin-bottom:1.5rem;
      font-size:0.95rem;
    }

    .service {
      background:#fff;
      border:1px solid #D8DDE0;
      padding:1rem;
      border-radius:6px;
      margin-bottom:1rem;
    }

    .service h3 {
      margin-top:0;
      color:#003087;
    }

    /* TREATMENT TYPE BADGES */
    .badge {
      display:inline-block;
      padding:0.25rem 0.6rem;
      border-radius:4px;
      font-size:0.8rem;
      font-weight:bold;
      margin-bottom:0.6rem;
      color:#fff;
    }

    .badge-lifestyle {
      background:#007f3b; /* NHS green */
    }

    .badge-medication {
      background:#005EB8; /* NHS blue */
    }

    .badge-surgery {
      background:#DA291C; /* NHS red */
    }

    .service a {
      display:inline-block;
      margin-top:0.5rem;
      color:#005EB8;
      text-decoration:none;
      font-weight:bold;
    }

    .service a:hover {
      text-decoration:underline;
    }

    button {
      background:#005EB8;
      color:#fff;
      border:none;
      padding:0.9rem 1.6rem;
      font-size:1rem;
      border-radius:6px;
      cursor:pointer;
      margin-top:2rem;
    }

    button:hover {
      background:#003087;
    }

    .back-start-btn {
      background:#D8DDE0;
      color:#003087;
      margin-top:1rem;
    }

    .back-start-btn:hover {
      background:#C0C6CC;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Your Results</h1>

    <div id="summary" class="result-box"></div>

    <h2>Services You May Be Eligible For</h2>
    <div id="services"></div>

    <!-- BACK TO START BUTTON -->
    <button class="back-start-btn" onclick="location.href='index.html'">
      Back to Start
    </button>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("wmData") || "{}");

    /* Ensure height/weight are numbers */
    data.height = Number(data.height);
    data.weight = Number(data.weight);

    function calculateBMI(weight, height) {
      return (weight / ((height / 100) ** 2)).toFixed(1);
    }

    function buildSummary() {
      const bmi = calculateBMI(data.weight, data.height);
      const ethnicityAdj = data.ethnicity === "adjusted" ? " (adjusted thresholds apply)" : "";

      document.getElementById("summary").innerHTML = `
        <strong>Your BMI:</strong> ${bmi}${ethnicityAdj}<br><br>
        Based on the information you provided, here are the services you may be eligible for.
      `;
    }

    function buildServices() {
      const bmi = calculateBMI(data.weight, data.height);
      const services = [];

      /* DIGITAL WEIGHT MANAGEMENT */
      if (bmi >= 25) {
        services.push({
          title: "NHS Digital Weight Management Programme",
          desc: "A 12-week online programme to support weight loss.",
          link: "https://www.england.nhs.uk/digital-weight-management/",
          type: "lifestyle"
        });
      }

      /* LOCAL WEIGHT MANAGEMENT */
      if (bmi >= 30 || (bmi >= 27.5 && String(data.ethnicity).toLowerCase().trim() === "adjusted")) {
        services.push({
          title: "Local Weight Management Support",
          desc: "Community-based lifestyle support to help you manage your weight.",
          link: "https://www.nhs.uk/live-well/healthy-weight/",
          type: "lifestyle"
        });
      }

      /* DIABETES PREVENTION */
      if (data.prediabetes || data.gestational) {
        services.push({
          title: "NHS Diabetes Prevention Programme",
          desc: "Support to reduce your risk of developing Type 2 diabetes.",
          link: "https://www.england.nhs.uk/nhs-diabetes-prevention/",
          type: "lifestyle"
        });
      }

      /* SPECIALIST WEIGHT MANAGEMENT */
      if (bmi >= 35 && (data.t2dm || data.hypertension)) {
        services.push({
          title: "Specialist Weight Management Service",
          desc: "Clinically-led support for people with more complex weight-related health needs.",
          link: "https://www.nhs.uk/conditions/obesity/treatment/",
          type: "lifestyle"
        });
      }

      /* MEDICATION & LIFESTYLE */
      if (bmi >= 35 && data.t2dm) {
        services.push({
          title: "Weight Loss Medication (Wegovy / Mounjaro)",
          desc: "You may meet criteria for NHS weight loss medicines, alongside lifestyle support.",
          link: "https://www.nhs.uk/medicines/weight-loss-medicines/",
          type: "medication"
        });
      }

      /* SURGERY */
      if (bmi >= 40 || (bmi >= 35 && data.surgeryBarrier)) {
        services.push({
          title: "Weight Loss Surgery Assessment",
          desc: "Assessment for surgical weight loss options.",
          link: "https://www.nhs.uk/conditions/weight-loss-surgery/",
          type: "surgery"
        });
      }

      const container = document.getElementById("services");

      const badgeMap = {
        lifestyle: '<span class="badge badge-lifestyle">Lifestyle</span>',
        medication: '<span class="badge badge-medication">Medication & Lifestyle</span>',
        surgery: '<span class="badge badge-surgery">Surgery</span>'
      };

      container.innerHTML = services.length
        ? services.map(s => `
            <div class="service">
              ${badgeMap[s.type]}
              <h3>${s.title}</h3>
              <p>${s.desc}</p>
              <a href="${s.link}" target="_blank">Visit NHS website</a>
            </div>
          `).join("")
        : "<p>No services matched your criteria.</p>";
    }

    buildSummary();
    buildServices();
  </script>
</body>
</html>
