<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background:#E8F1F8;
      margin:0;
      padding:0;
    }

    .container {
      max-width:900px;
      margin:2rem auto;
      background:#fff;
      padding:2rem;
      border-radius:8px;
      border:1px solid #D8DDE0;
    }

    h1 {
      color:#005EB8;
      margin-top:0;
      margin-bottom:1rem;
    }

    h2 {
      color:#003087;
      margin-top:2rem;
      margin-bottom:0.5rem;
    }

    .result-box {
      background:#F0F7FF;
      border-left:4px solid #005EB8;
      padding:1rem;
      border-radius:4px;
      color:#003087;
      margin-bottom:1.5rem;
      font-size:0.95rem;
    }

    .service {
      background:#fff;
      border:1px solid #D8DDE0;
      padding:1rem;
      border-radius:6px;
      margin-bottom:1rem;
    }

    .service h3 {
      margin-top:0;
      color:#003087;
    }

    button {
      background:#005EB8;
      color:#fff;
      border:none;
      padding:0.9rem 1.6rem;
      font-size:1rem;
      border-radius:6px;
      cursor:pointer;
      margin-top:2rem;
    }

    button:hover {
      background:#003087;
    }

    .back-start-btn {
      background:#D8DDE0;
      color:#003087;
      margin-top:1rem;
    }

    .back-start-btn:hover {
      background:#C0C6CC;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Your Results</h1>

    <div id="summary" class="result-box">
      <!-- BMI + summary inserted by JS -->
    </div>

    <h2>Services You May Be Eligible For</h2>
    <div id="services"></div>

    <!-- BACK TO START BUTTON -->
    <button class="back-start-btn" onclick="location.href='index.html'">
      Back to Start
    </button>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem("wmData") || "{}");

    function calculateBMI(weight, height) {
      return (weight / ((height / 100) ** 2)).toFixed(1);
    }

    function buildSummary() {
      const bmi = calculateBMI(data.weight, data.height);
      const ethnicityAdj = data.ethnicity === "adjusted" ? " (adjusted thresholds apply)" : "";

      document.getElementById("summary").innerHTML = `
        <strong>Your BMI:</strong> ${bmi}${ethnicityAdj}<br><br>
        Based on the information you provided, here are the services you may be eligible for.
      `;
    }

    function buildServices() {
      const bmi = calculateBMI(data.weight, data.height);
      const services = [];

      // Example logic — your existing logic stays the same
      if (bmi >= 25) {
        services.push({
          title: "Digital Weight Management Programme",
          desc: "You may be eligible for digital support to help manage your weight."
        });
      }

      if (bmi >= 30 || (bmi >= 27.5 && data.ethnicity === "adjusted")) {
        services.push({
          title: "Tier 2 Weight Management",
          desc: "You may be eligible for local Tier 2 weight management services."
        });
      }

      if (bmi >= 35 && (data.t2dm || data.hypertension)) {
        services.push({
          title: "Tier 3 Specialist Weight Management",
          desc: "You may be eligible for specialist Tier 3 support."
        });
      }

      if (bmi >= 40 || (bmi >= 35 && data.surgeryBarrier)) {
        services.push({
          title: "Tier 4 Bariatric Surgery Assessment",
          desc: "You may be eligible for Tier 4 bariatric surgery assessment."
        });
      }

      const container = document.getElementById("services");
      container.innerHTML = services.length
        ? services.map(s => `
            <div class="service">
              <h3>${s.title}</h3>
              <p>${s.desc}</p>
            </div>
          `).join("")
        : "<p>No services matched your criteria.</p>";
    }

    buildSummary();
    buildServices();
  </script>
</body>
</html>
