<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About You</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; margin: 40px; }
label { display: block; margin-top: 15px; }
input { padding: 8px; width: 250px; }
button { margin-top: 25px; padding: 12px 20px; font-size: 18px; }
</style>
</head>

<body>
<h1>About You</h1>

<label>Full Name</label>
<input id="fullName" type="text">

<label>Age</label>
<input id="age" type="number">

<label>Height (cm)</label>
<input id="height" type="number">

<label>Weight (kg)</label>
<input id="weight" type="number">

<label>Waist (cm)</label>
<input id="waist" type="number">

<label>Hip (cm)</label>
<input id="hip" type="number">

<h3>Medical Conditions</h3>
<label><input type="checkbox" value="southAsian" class="cond"> South Asian background</label>
<label><input type="checkbox" value="hypertension" class="cond"> Hypertension</label>
<label><input type="checkbox" value="diabetes" class="cond"> Diabetes</label>

<button onclick="saveAndContinue()">Show Results</button>

<script>
function saveAndContinue() {
    const fullName = document.getElementById("fullName").value;
    const age = document.getElementById("age").value;
    const height = document.getElementById("height").value;
    const weight = document.getElementById("weight").value;
    const waist = document.getElementById("waist").value;
    const hip = document.getElementById("hip").value;

    const conditions = [];
    document.querySelectorAll(".cond:checked").forEach(c => conditions.push(c.value));

    localStorage.setItem("fullName", fullName);
    localStorage.setItem("age", age);
    localStorage.setItem("height", height);
    localStorage.setItem("weight", weight);
    localStorage.setItem("waist", waist);
    localStorage.setItem("hip", hip);
    localStorage.setItem("conditions", JSON.stringify(conditions));

    location.href = "results.html";
}
</script>

</body>
</html>
