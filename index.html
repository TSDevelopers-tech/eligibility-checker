<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS Adult Weight Management – Eligibility Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f4f5;
        }

        .nhs-header {
            background: #005EB8;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: #005EB8;
            margin-top: 0;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .checkbox-group label {
            font-weight: normal;
            display: block;
            margin-top: 5px;
        }

        button {
            background: #005EB8;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 12px 18px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #003f7d;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #e8f4ff;
            border-left: 6px solid #005EB8;
            border-radius: 4px;
        }

        .service {
            margin-bottom: 25px;
            padding: 15px;
            background: #f7f9fa;
            border-radius: 6px;
            border-left: 4px solid #005EB8;
        }

        .service h3 {
            margin: 0 0 10px 0;
            color: #005EB8;
        }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        .tag-lifestyle { background:#d4f4d4; }
        .tag-medication { background:#ffe4b3; }
        .tag-surgery { background:#f8c4c4; }

        .why-box {
            background: #e8f4ff;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            border-left: 4px solid #005EB8;
        }

        small { color:#555; }
    </style>
</head>

<body>

<div class="nhs-header">
    <h1>NHS Adult Weight Management Services</h1>
    <p>Eligibility Checker</p>
</div>

<div class="container">

    <h2>Your details</h2>

    <label for="bmi">BMI</label>
    <input type="number" id="bmi" step="0.1" placeholder="e.g. 32.5">

    <label for="ethnicity">Ethnic background (for BMI adjustment)</label>
    <select id="ethnicity">
        <option value="white">White / Other</option>
        <option value="asian">Asian</option>
        <option value="middleEastern">Middle Eastern</option>
        <option value="blackAfrican">Black African</option>
        <option value="africanCaribbean">African-Caribbean</option>
    </select>
    <small>*BMI thresholds are reduced by 2.5 for Asian, Middle Eastern, Black African or African-Caribbean
